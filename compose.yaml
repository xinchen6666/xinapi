name: xinapi

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

x-redis: &redis
  <<: *common
  image: ${XINAPI_REDIS_IMAGE:-redis:8-alpine}
  command:
    - /bin/sh
    - -ec
    - |
      exec docker-entrypoint.sh redis-server - <<EOF
      appendonly yes
      requirepass $${REDIS_PASSWORD:?}
      EOF

services:
  postgres:
    <<: *common
    image: ${XINAPI_POSTGRES_IMAGE:-postgres:18-bookworm}
    env_file: ${XINAPI_CONFIG_DIR:-./.runtime/x04}/postgres.env
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -s "$${PGDATA:?}/PG_VERSION" ] && [ ! -f "$${PGDATA}/.xinapi-databases-ready" ]; then
          echo 'Incomplete xinapi cluster initialization; preserve volume and original credentials. See docs/COMPOSE.md for preserved-volume repair.' >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres

    environment:
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - pg:/var/lib/postgresql
      - ./deploy/compose/init-db.sh:/docker-entrypoint-initdb.d/10-xinapi.sh:ro
    networks: [newapi-data, cpr-data]

  redis-newapi:
    <<: *redis
    env_file: ${XINAPI_CONFIG_DIR:-./.runtime/x04}/redis-newapi.env
    volumes: [redis-newapi:/data]
    networks: [newapi-data]

  redis-cpr:
    <<: *redis
    env_file: ${XINAPI_CONFIG_DIR:-./.runtime/x04}/redis-cpr.env
    volumes: [redis-cpr:/data]
    networks: [cpr-data]

  new-api:
    <<: *common
    image: ${XINAPI_NEW_API_IMAGE:-xinapi/new-api:x04-local}
    pull_policy: never
    depends_on: [postgres, redis-newapi]
    env_file: ${XINAPI_CONFIG_DIR:-./.runtime/x04}/new-api.env
    environment:
      XINAPI_CPR_ADMIN_KEY_FILE: /run/xinapi/cpr-admin.key
    ports: ['127.0.0.1:${XINAPI_PORT:-3000}:3000']
    volumes:
      - newapi:/data
      - type: bind
        source: ${XINAPI_CONFIG_DIR:-./.runtime/x04}/new-api-secrets
        target: /run/xinapi
        read_only: true
        bind:
          create_host_path: false
    networks: [gateway, newapi-data]

  cpr:
    <<: *common
    image: ${XINAPI_CPR_IMAGE:-xinapi/cpr:x04-local}
    pull_policy: never
    depends_on: [postgres, redis-cpr]
    env_file: ${XINAPI_CONFIG_DIR:-./.runtime/x04}/cpr.env
    environment:
      HOME: /app
      CPR_SERVER_HOST: 0.0.0.0
      CPR_SERVER_PORT: '8080'
      CPR_WEB_DIST_DIR: /app/web/dist
    user: '10001:10001'
    init: true
    pids_limit: 256
    mem_limit: ${XINAPI_CPR_MEMORY_LIMIT:-1g}
    cpus: ${XINAPI_CPR_CPU_LIMIT:-2.0}
    stop_grace_period: 75s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [/bin/sh, /etc/xinapi/start-cpr.sh]
    volumes:
      - cpr-data:/app/.runtime/data
      - cpr-logs:/app/.runtime/logs
      - ./deploy/compose/cpr-entrypoint.sh:/etc/xinapi/start-cpr.sh:ro
      - ./services/codex-proxy-rs/deploy/config.example.yaml:/etc/xinapi/cpr-template.yaml:ro
    tmpfs:
      - /app/deploy:size=1m,uid=10001,gid=10001,mode=0700
    networks: [gateway, cpr-data]

networks:
  gateway: {}
  newapi-data: {internal: true}
  cpr-data: {internal: true}

volumes:
  pg: {}
  redis-newapi: {}
  redis-cpr: {}
  cpr-data: {}
  cpr-logs: {}
  newapi: {}
